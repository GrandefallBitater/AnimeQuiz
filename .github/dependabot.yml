version: 2

# Dependabot reads this file from the default branch, so updates start only
# after the file is merged into main.
updates:
  # Maven dependencies and plugins.
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades break the build and need a migration, so request them by hand.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      maven:
        patterns:
          - '*'

  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades break the build and need a migration, so request them by hand.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - '*'
