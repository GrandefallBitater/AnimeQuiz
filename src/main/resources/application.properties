server.port=8081
server.address=0.0.0.0
app.version=@project.version@
spring.datasource.url=jdbc:postgresql://localhost:5433/AnimeQuiz?currentSchema=main
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.schemas=main
spring.flyway.default-schema=main

app.storage.location=${user.home}/.animequiz/storage

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.thymeleaf.cache=false

app.yummy.base-url=https://api.yani.tv
app.yummy.app-token=${YUMMY_APP_TOKEN:}

app.mal.base-url=https://api.myanimelist.net/v2
app.mal.client-id=${MAL_CLIENT_ID:}
app.mal.web-base-url=https://myanimelist.net

app.shikimori.base-url=https://shikimori.io/api
app.shikimori.site-origin=https://shikimori.io
app.shikimori.user-agent=AnimeQuiz (ruslan@fattakhov.net)

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000

logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never