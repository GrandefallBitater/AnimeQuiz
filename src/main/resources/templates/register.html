<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — AnimeQuiz</title>
    <link rel="icon" type="image/png" th:href="@{server-images/anime-logo.png}">
    <link rel="stylesheet" th:href="@{/auth/auth.css}">
    <link rel="stylesheet" th:href="@{toast.css}">
    <link rel="stylesheet" th:href="@{floating_icons.css}">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class="global-floating-icons">
    <span>⚔️</span><span>🌸</span><span>🎮</span><span>⭐</span>
    <span>🔥</span><span>💫</span><span>🍥</span><span>👻</span>
</div>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-logo"></div>
        <h1 class="auth-title">Создание аккаунта</h1>
        <p class="auth-subtitle">Присоединяйтесь к миру аниме-квизов</p>
    </div>

    <div th:if="${infoMessage}" class="auth-alert auth-alert-info">
        <span></span>
        <span th:text="${infoMessage}">Сообщение</span>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label for="regUsername">Никнейм</label>
            <input type="text"
                   id="regUsername"
                   class="form-input"
                   placeholder="Придумайте никнейм"
                   required
                   autocomplete="username">
        </div>

        <div class="form-group">
            <label for="regPassword">Пароль</label>
            <div class="password-wrap">
                <input type="password"
                       id="regPassword"
                       class="form-input"
                       placeholder="Минимум 6 символов"
                       required
                       autocomplete="new-password">
                <button type="button"
                        class="password-toggle"
                        aria-label="Показать пароль"
                        title="Показать пароль"
                        aria-pressed="false">
                    <svg class="lock-closed" viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <svg class="lock-open" viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="regPasswordConfirm">Подтвердите пароль</label>
            <div class="password-wrap">
                <input type="password"
                       id="regPasswordConfirm"
                       class="form-input"
                       placeholder="Повторите пароль"
                       required
                       autocomplete="new-password">
                <button type="button"
                        class="password-toggle"
                        aria-label="Показать пароль"
                        title="Показать пароль"
                        aria-pressed="false">
                    <svg class="lock-closed" viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <svg class="lock-open" viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-auth" id="registerBtn">
            <span>Создать аккаунт</span>
            <span></span>
        </button>
    </form>

    <div class="auth-switch">
        Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
    </div>
    <div class="auth-switch">
        хотите продолжить как гость? <a th:href="@{/}">на главную</a>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script type="text/javascript" th:src="@{jQuerry.js}"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:src="@{toast.js}"></script>
<script th:src="@{/auth/authScript.js}"></script>
</body>
</html>
