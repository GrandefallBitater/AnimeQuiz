name: Deploy to the local machine

on:
  push:
    # Deployments follow "dev" for now. Change this to "main" when main becomes
    # the branch that should run on this machine.
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

# Two deploys must never overlap, and a running deploy must not be cancelled:
# a half-finished "docker compose up" is worse than waiting.
concurrency:
  group: deploy-local
  cancel-in-progress: false

defaults:
  run:
    # The deploy checkout, not the runner workspace. A fixed path keeps the
    # .env and the relative folders (./backups, ./scripts/backup) stable.
    # Change this path on another machine.
    working-directory: C:\Users\ruslan\Documents\server\AnimeQuizDeploy\AnimeQuiz

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40

    steps:
      - name: Check the deploy checkout
        shell: pwsh
        run: |
          if (-not (Test-Path '.git')) {
            throw "No git checkout in $PWD. Clone the repository there first."
          }
          if (-not (Test-Path '.env')) {
            throw "No .env in $PWD. Copy .env.example and fill it in."
          }

      - name: Update the deploy checkout
        shell: pwsh
        run: |
          git fetch --prune origin dev
          git reset --hard origin/dev
          git --no-pager log -1 --oneline

      - name: Rebuild and restart the containers
        shell: pwsh
        run: docker compose up -d --build

      - name: Wait for the application
        shell: pwsh
        run: |
          $url = 'http://127.0.0.1:8081/login'
          $ok = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "Application answered with 200 on attempt $attempt"
                $ok = $true
                break
              }
            } catch {
              # The application is probably still starting; try again below.
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            docker compose ps
            docker compose logs --tail 100 app
            throw "Application did not answer at $url"
          }

      - name: Show the running services
        if: always()
        shell: pwsh
        run: docker compose ps
