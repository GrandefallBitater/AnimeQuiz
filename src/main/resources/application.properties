server.port=8081
server.address=0.0.0.0
server.servlet.session.timeout=30m
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

rate.limit.login.username.capacity=10
rate.limit.login.username.window=15m
rate.limit.login.ip.capacity=10
rate.limit.login.ip.window=15m
rate.limit.register.ip.capacity=3
rate.limit.register.ip.window=1h
rate.limit.imports.user.capacity=15
rate.limit.imports.user.window=1h
app.version=@project.version@
spring.jpa.open-in-view=true
logging.charset.file=UTF-8
spring.datasource.url=jdbc:postgresql://localhost:5433/AnimeQuiz?currentSchema=main
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.schemas=main
spring.flyway.default-schema=main

app.storage.location=${user.home}/.animequiz/storage

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.thymeleaf.cache=false

app.yummy.base-url=https://api.yani.tv
app.yummy.app-token=${YUMMY_APP_TOKEN:}

app.mal.base-url=https://api.myanimelist.net/v2
app.mal.client-id=${MAL_CLIENT_ID:}
app.mal.web-base-url=https://myanimelist.net

app.shikimori.base-url=https://shikimori.io/api
app.shikimori.site-origin=https://shikimori.io
app.shikimori.user-agent=AnimeQuiz (ruslan@fattakhov.net)

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000

logging.file.name=logs/app.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never